<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Looking for Blood - BloodSync</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <nav class="nav container">
            <div class="logo">🩸 BloodSync</div>
            <ul class="nav-links">
                <li><a href="index.html#home">Home</a></li>
                <li><a href="index.html#articles">Articles</a></li>
                <li><a href="index.html#services">Services</a></li>
                <li><a href="index.html#emergency">Emergency</a></li>
                <li><a href="index.html#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <section class="appointment-page">
        <div class="container">
            <div style="text-align: center; margin-bottom: 2rem;">
                <h1 style="color: #8B0000;">Looking for Blood?</h1>
                <p style="color: #666;">Tell us what you need. We'll post your request and show you compatible donors right away.</p>
            </div>

            <form id="requestForm" class="appointment-form">
                <div class="form-group">
                    <label>Your Name</label>
                    <input type="text" name="name" placeholder="Your full name" required>
                </div>
                <div class="form-group">
                    <label>Contact Number</label>
                    <input type="tel" name="phone" placeholder="Enter a 10 digit number" required>
                </div>
                <div class="form-group">
                    <label>Blood Group Needed</label>
                    <select name="bloodGroupNeeded" id="bloodGroupNeeded" required>
                        <option value="">Select Blood Group</option>
                        <option value="A+">A+</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="B-">B-</option>
                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>
                        <option value="O+">O+</option>
                        <option value="O-">O-</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Location</label>
                    <input type="text" name="location" id="requestLocation" placeholder="City, State" required>
                </div>
                <div class="form-group">
                    <label>Urgency</label>
                    <select name="urgency" required>
                        <option value="normal">Normal</option>
                        <option value="urgent">Urgent</option>
                        <option value="critical">Critical</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Additional Notes (optional)</label>
                    <input type="text" name="notes" placeholder="Hospital name, ward, or other details">
                </div>
                <button type="submit" class="submit-btn">Post Request & Find Donors</button>
            </form>

            <div id="requestResult" class="eligibility-result"></div>

            <div id="matchedDonors" class="matched-donors"></div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer" id="contact">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; BloodSync 2024 | Made with love by Swati</p>
            </div>
        </div>
    </footer>

    <script src="js/looking-for-blood.js"></script>
</body>
</html>
