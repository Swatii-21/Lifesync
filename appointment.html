<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book an Appointment - BloodSync</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <nav class="nav container">
            <div class="logo">🩸 BloodSync</div>
            <ul class="nav-links">
                <li><a href="index.html#home">Home</a></li>
                <li><a href="index.html#articles">Articles</a></li>
                <li><a href="index.html#services">Services</a></li>
                <li><a href="index.html#emergency">Emergency</a></li>
                <li><a href="index.html#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <section class="appointment-page">
        <div class="container">
            <div style="text-align: center; margin-bottom: 2rem;">
                <h1 style="color: #8B0000;">Book an Appointment</h1>
                <p style="color: #666;">Schedule your blood donation online or offline. We'll confirm it shortly.</p>
            </div>

            <form id="appointmentForm" class="appointment-form">
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" name="name" placeholder="Your full name" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="email" placeholder="Your Email Address" required>
                </div>
                <div class="form-group">
                    <label>Contact Number</label>
                    <input type="tel" name="phone" placeholder="Enter a 10 digit number" required>
                </div>
                <div class="form-group">
                    <label>Blood Group</label>
                    <select name="bloodGroup" required>
                        <option value="">Select Blood Group</option>
                        <option value="A+">A+</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="B-">B-</option>
                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>
                        <option value="O+">O+</option>
                        <option value="O-">O-</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Appointment Type</label>
                    <select name="mode" id="modeSelect" required>
                        <option value="">Select Mode</option>
                        <option value="online">Online (Video consultation)</option>
                        <option value="offline">Offline (In-person at a center)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label id="locationLabel">Preferred Hospital / Camp</label>
                    <input type="text" name="location" id="locationInput" placeholder="e.g. AIIMS Delhi" required>
                </div>
                <div class="form-group">
                    <label>Preferred Date</label>
                    <input type="date" name="preferredDate" required>
                </div>
                <div class="form-group">
                    <label>Preferred Time</label>
                    <input type="time" name="preferredTime" required>
                </div>
                <div class="form-group">
                    <label>Additional Notes (optional)</label>
                    <input type="text" name="notes" placeholder="Anything we should know?">
                </div>
                <button type="submit" class="submit-btn">Book Appointment</button>
            </form>

            <div id="appointmentResult" class="eligibility-result"></div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer" id="contact">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; BloodSync 2024 | Made with love by Swati</p>
            </div>
        </div>
    </footer>

    <script src="js/appointment.js"></script>
</body>
</html>
