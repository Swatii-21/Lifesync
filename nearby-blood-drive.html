<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nearby Blood Drives - BloodSync</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <nav class="nav container">
            <div class="logo">🩸 BloodSync</div>
            <ul class="nav-links">
                <li><a href="index.html#home">Home</a></li>
                <li><a href="index.html#articles">Articles</a></li>
                <li><a href="index.html#services">Services</a></li>
                <li><a href="index.html#emergency">Emergency</a></li>
                <li><a href="index.html#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <section class="appointment-page">
        <div class="container">
            <div style="text-align: center; margin-bottom: 2rem;">
                <h1 style="color: #8B0000;">Nearby Blood Drives</h1>
                <p style="color: #666;">Find an upcoming blood donation camp near you.</p>
            </div>

            <!-- Search -->
            <div class="search-box" style="max-width: 600px; margin: 0 auto 2rem;">
                <input type="text" id="driveLocationSearch" class="search-input" placeholder="Search by city or area">
                <button id="driveSearchBtn" class="search-btn">🔍 Find Drives</button>
            </div>

            <div id="driveResults" class="matched-donors"></div>

            <!-- Organize a drive -->
            <div style="text-align: center; margin: 3rem 0 1.5rem;">
                <h2 style="color: #8B0000; font-size: 1.6rem;">Organizing a Blood Drive?</h2>
                <p style="color: #666;">Add it here so donors nearby can find it.</p>
            </div>

            <form id="driveForm" class="appointment-form">
                <div class="form-group">
                    <label>Drive Title</label>
                    <input type="text" name="title" placeholder="e.g. College Blood Donation Camp" required>
                </div>
                <div class="form-group">
                    <label>Organizer Name</label>
                    <input type="text" name="organizer" placeholder="e.g. Red Cross Society" required>
                </div>
                <div class="form-group">
                    <label>City / Area</label>
                    <input type="text" name="location" placeholder="e.g. Delhi" required>
                </div>
                <div class="form-group">
                    <label>Full Address</label>
                    <input type="text" name="address" placeholder="e.g. XYZ College, Sector 5, Delhi" required>
                </div>
                <div class="form-group">
                    <label>Date</label>
                    <input type="date" name="date" required>
                </div>
                <div class="form-group">
                    <label>Start Time</label>
                    <input type="time" name="startTime" required>
                </div>
                <div class="form-group">
                    <label>End Time</label>
                    <input type="time" name="endTime" required>
                </div>
                <div class="form-group">
                    <label>Contact Number</label>
                    <input type="tel" name="contactPhone" placeholder="Enter a 10 digit number" required>
                </div>
                <div class="form-group">
                    <label>Additional Notes (optional)</label>
                    <input type="text" name="notes" placeholder="Anything donors should know?">
                </div>
                <button type="submit" class="submit-btn">Add Blood Drive</button>
            </form>

            <div id="driveFormResult" class="eligibility-result"></div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer" id="contact">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; BloodSync 2024 | Made with love by Swati</p>
            </div>
        </div>
    </footer>

    <script src="js/nearby-blood-drive.js"></script>
</body>
</html>
